<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearMark - 圖片去浮水印工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
            touch-action: none; /* Prevent scrolling while drawing */
            overflow: hidden; /* Main layout handles overflow */
        }
        .canvas-container {
            background-image: 
                linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            /* Layout fix: Ensure canvas fits in remaining height minus headers */
            max-height: calc(100vh - 180px); 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            cursor: crosshair;
            max-width: 100%;
            max-height: 100%; /* Fill container but respect aspect ratio */
            object-fit: contain;
        }
        input[type=range] {
            accent-color: #3b82f6;
        }
        select:disabled {
            background-color: #f3f4f6;
            cursor: not-allowed;
            opacity: 0.7;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c1c1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8; 
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shadow-sm z-20 flex-none h-16">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 p-1.5 rounded-lg">
                <i data-lucide="eraser" class="text-white w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800 tracking-tight">ClearMark</h1>
        </div>
        <div class="text-sm text-gray-500 hidden md:block">
            智慧紋理重建 & Logo 合成工具
        </div>
        <button id="downloadBtn" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            <i data-lucide="download" class="w-4 h-4"></i>
            下載
        </button>
    </header>

    <!-- Toolbar -->
    <div class="bg-white border-b border-gray-200 px-4 py-3 flex flex-wrap gap-4 items-center justify-center sm:justify-between z-20 shadow-sm flex-none">
        
        <!-- Left Group: Uploads -->
        <div class="flex items-center gap-2">
            <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-medium transition-colors shadow-sm" title="選擇要修復的圖片">
                <i data-lucide="image-plus" class="w-4 h-4"></i>
                <span class="hidden sm:inline">上傳圖片</span>
                <input type="file" id="imageInput" accept="image/*" class="hidden">
            </label>

            <!-- Logo Upload -->
            <label class="cursor-pointer bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-medium transition-colors shadow-sm" title="選擇 Logo 檔案">
                <i data-lucide="stamp" class="w-4 h-4"></i>
                <span class="hidden sm:inline">選擇 Logo</span>
                <input type="file" id="logoInput" accept="image/png,image/jpeg" class="hidden">
            </label>
        </div>

        <!-- Middle Group: Logo Options -->
        <div class="hidden sm:flex items-center gap-3 px-3 border-l border-r border-gray-200">
            <label class="flex items-center gap-1.5 text-sm text-gray-700 font-medium cursor-pointer select-none">
                <input type="checkbox" id="enableLogo" class="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-gray-300">
                加上 Logo
            </label>
            <select id="logoPosition" class="text-sm border border-gray-300 rounded-md py-1 px-2 focus:ring-2 focus:ring-blue-500 outline-none bg-white" disabled>
                <option value="tl">左上</option>
                <option value="tr">右上</option>
                <option value="bl">左下</option>
                <option value="br">右下</option>
            </select>
        </div>

        <!-- Right Group: Brush & Actions -->
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2">
                <span class="text-xs font-medium text-gray-600 hidden sm:inline">筆刷</span>
                <input type="range" id="brushSize" min="5" max="100" value="20" class="w-20 sm:w-24 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>
            
            <button id="undoBtn" class="p-2 hover:bg-gray-100 rounded-full text-gray-600 transition-colors" title="復原塗抹">
                <i data-lucide="undo-2" class="w-5 h-5"></i>
            </button>
            <button id="clearMaskBtn" class="p-2 hover:bg-red-50 text-red-500 rounded-full transition-colors" title="清除所有塗抹">
                <i data-lucide="trash-2" class="w-5 h-5"></i>
            </button>

            <button id="processBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 font-bold shadow-md transform active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none" disabled>
                <i data-lucide="wand-2" class="w-4 h-4"></i>
                <span class="hidden sm:inline">開始修復</span>
                <span class="sm:hidden">修復</span>
            </button>
        </div>
    </div>

    <!-- Mobile Logo Options (Visible only on small screens) -->
    <div class="sm:hidden bg-gray-50 border-b border-gray-200 px-4 py-2 flex items-center justify-between gap-2 z-10">
        <label class="flex items-center gap-2 text-sm text-gray-700 font-medium">
            <input type="checkbox" id="enableLogoMobile" class="w-4 h-4 text-blue-600 rounded">
            加上 Logo
        </label>
        <select id="logoPositionMobile" class="text-sm border border-gray-300 rounded py-1 px-2 w-24" disabled>
            <option value="tl">左上</option>
            <option value="tr">右上</option>
            <option value="bl">左下</option>
            <option value="br">右下</option>
        </select>
    </div>

    <!-- Main Canvas Area -->
    <main class="flex-1 overflow-auto flex flex-col justify-center items-center p-4 bg-gray-100 relative w-full z-0" id="mainContainer">
        
        <!-- Empty State -->
        <div id="emptyState" class="flex flex-col items-center justify-center text-gray-400">
            <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center mb-4">
                <i data-lucide="image" class="w-10 h-10 text-gray-400"></i>
            </div>
            <p class="text-lg font-medium">請先上傳一張圖片</p>
            <p class="text-sm mt-2">支援 JPG, PNG 等格式</p>
        </div>

        <!-- Canvas Container -->
        <div id="canvasWrapper" class="canvas-container relative hidden rounded-sm overflow-hidden border border-gray-300 bg-white">
            <!-- The Main Image Canvas -->
            <canvas id="imageCanvas"></canvas>
            <!-- The Mask Canvas (For drawing red lines) -->
            <canvas id="maskCanvas" class="absolute top-0 left-0 opacity-60"></canvas>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="absolute inset-0 bg-black/50 backdrop-blur-sm z-50 flex flex-col items-center justify-center hidden">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-4"></div>
            <p class="text-white font-medium text-lg animate-pulse">正在精緻修復...</p>
            <p class="text-white/80 text-sm mt-1">重建紋理與色彩</p>
        </div>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-lg text-sm transition-opacity opacity-0 pointer-events-none z-50 flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4"></i>
        <span id="toastMsg">Notification</span>
    </div>

    <script>
        // --- Icons ---
        lucide.createIcons();

        // --- DOM Elements ---
        const imageInput = document.getElementById('imageInput');
        const logoInput = document.getElementById('logoInput');
        
        // Logo Controls (Desktop)
        const enableLogo = document.getElementById('enableLogo');
        const logoPosition = document.getElementById('logoPosition');
        
        // Logo Controls (Mobile)
        const enableLogoMobile = document.getElementById('enableLogoMobile');
        const logoPositionMobile = document.getElementById('logoPositionMobile');

        const brushSizeInput = document.getElementById('brushSize');
        const processBtn = document.getElementById('processBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const undoBtn = document.getElementById('undoBtn');
        const clearMaskBtn = document.getElementById('clearMaskBtn');
        
        const canvasWrapper = document.getElementById('canvasWrapper');
        const imageCanvas = document.getElementById('imageCanvas');
        const maskCanvas = document.getElementById('maskCanvas');
        const emptyState = document.getElementById('emptyState');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // --- Contexts ---
        const ctx = imageCanvas.getContext('2d', { willReadFrequently: true });
        const maskCtx = maskCanvas.getContext('2d', { willReadFrequently: true });

        // --- State ---
        let isDrawing = false;
        let originalImage = null;
        let currentBrushSize = 20;
        let history = []; 
        let userUploadedLogo = null; 

        // --- Sync Desktop/Mobile Controls ---
        function syncControls(source, target) {
            target.checked = source.checked;
            target.disabled = source.disabled;
        }
        function syncSelect(source, target) {
            target.value = source.value;
            target.disabled = source.disabled;
        }

        enableLogo.addEventListener('change', () => {
            logoPosition.disabled = !enableLogo.checked;
            syncControls(enableLogo, enableLogoMobile);
            syncSelect(logoPosition, logoPositionMobile);
        });
        
        enableLogoMobile.addEventListener('change', () => {
            logoPositionMobile.disabled = !enableLogoMobile.checked;
            syncControls(enableLogoMobile, enableLogo);
            syncSelect(logoPositionMobile, logoPosition);
        });

        logoPosition.addEventListener('change', () => logoPositionMobile.value = logoPosition.value);
        logoPositionMobile.addEventListener('change', () => logoPosition.value = logoPositionMobile.value);


        // --- Initialization ---
        function resizeCanvases(width, height) {
            imageCanvas.width = width;
            imageCanvas.height = height;
            maskCanvas.width = width;
            maskCanvas.height = height;
            
            maskCtx.lineCap = 'round';
            maskCtx.lineJoin = 'round';
            maskCtx.strokeStyle = '#ff0000';
            maskCtx.lineWidth = currentBrushSize;
        }

        function showToast(message) {
            toastMsg.innerText = message;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 3000);
        }

        // --- Event Listeners: UI ---

        // Brush Size
        brushSizeInput.addEventListener('input', (e) => {
            currentBrushSize = parseInt(e.target.value);
            maskCtx.lineWidth = currentBrushSize;
        });

        // Image Upload
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    const maxSize = 2000; 
                    let width = img.width;
                    let height = img.height;

                    if (width > maxSize || height > maxSize) {
                        const ratio = Math.min(maxSize / width, maxSize / height);
                        width = Math.floor(width * ratio);
                        height = Math.floor(height * ratio);
                        showToast(`圖片較大，已自動縮放至 ${width}x${height}`);
                    }

                    resizeCanvases(width, height);
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    originalImage = ctx.getImageData(0, 0, width, height);
                    
                    // UI Updates
                    emptyState.classList.add('hidden');
                    canvasWrapper.classList.remove('hidden');
                    processBtn.disabled = false;
                    downloadBtn.disabled = true; 
                    
                    history = [];
                    saveHistory();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Logo Upload
        logoInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    userUploadedLogo = img;
                    // Auto-enable logo checkbox when uploading
                    enableLogo.checked = true;
                    logoPosition.disabled = false;
                    enableLogoMobile.checked = true;
                    logoPositionMobile.disabled = false;
                    showToast("Logo 已載入");
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Download
        downloadBtn.addEventListener('click', () => {
            if (!imageCanvas) return;
            try {
                const url = imageCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = 'clearmark-refined.png';
                link.href = url;
                link.click();
            } catch (e) {
                console.error("Download Error:", e);
                alert("⚠️ 下載失敗：瀏覽器安全限制\n請使用「選擇 Logo」上傳檔案，避免使用自動載入功能。");
            }
        });

        // Clear Mask
        clearMaskBtn.addEventListener('click', () => {
            maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
            saveHistory();
        });

        // Undo
        undoBtn.addEventListener('click', () => {
            if (history.length > 1) {
                history.pop(); 
                const previousState = history[history.length - 1];
                const img = new Image();
                img.onload = () => {
                    maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
                    maskCtx.drawImage(img, 0, 0);
                };
                img.src = previousState;
            } else if (history.length === 1) {
                maskCtx.clearRect(0, 0, maskCanvas.width, maskCanvas.height);
                history = []; 
                saveHistory(); 
            }
        });

        function saveHistory() {
            history.push(maskCanvas.toDataURL());
            if (history.length > 10) history.shift(); 
        }

        // --- Drawing Logic ---
        function getCoordinates(e) {
            const rect = maskCanvas.getBoundingClientRect();
            const scaleX = maskCanvas.width / rect.width;
            const scaleY = maskCanvas.height / rect.height;

            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
        }

        function startDrawing(e) {
            if (!originalImage) return;
            e.preventDefault();
            isDrawing = true;
            const { x, y } = getCoordinates(e);
            maskCtx.beginPath();
            maskCtx.moveTo(x, y);
            maskCtx.lineTo(x, y); 
            maskCtx.stroke();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            const { x, y } = getCoordinates(e);
            maskCtx.lineTo(x, y);
            maskCtx.stroke();
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                maskCtx.closePath();
                saveHistory();
            }
        }

        maskCanvas.addEventListener('mousedown', startDrawing);
        maskCanvas.addEventListener('mousemove', draw);
        maskCanvas.addEventListener('mouseup', stopDrawing);
        maskCanvas.addEventListener('mouseout', stopDrawing);
        maskCanvas.addEventListener('touchstart', startDrawing, { passive: false });
        maskCanvas.addEventListener('touchmove', draw, { passive: false });
        maskCanvas.addEventListener('touchend', stopDrawing);

        // --- Processing Logic ---

        processBtn.addEventListener('click', async () => {
            if (!originalImage) return;
            loadingOverlay.classList.remove('hidden');
            
            setTimeout(() => {
                try {
                    // 1. Inpainting
                    performTextureAwareInpainting();
                    
                    // 2. Logo Handling
                    if (enableLogo.checked) {
                        if (userUploadedLogo) {
                            drawLogo(userUploadedLogo);
                            finishProcessing("修復完成！(含自訂 Logo)");
                        } else {
                            // Try auto-load
                            const logo = new Image();
                            logo.onload = () => {
                                drawLogo(logo);
                                finishProcessing("修復完成！(含預設 Logo)");
                            };
                            logo.onerror = () => {
                                finishProcessing("修復完成 (找不到 logo.png)");
                            };
                            logo.src = 'logo.png';
                        }
                    } else {
                        finishProcessing("修復完成！");
                    }
                } catch (err) {
                    console.error(err);
                    showToast("處理時發生錯誤");
                    loadingOverlay.classList.add('hidden');
                }
            }, 100);
        });

        function drawLogo(img) {
            const pos = logoPosition.value;
            const padding = 20;
            
            // Calculate scale (Max 20% of canvas width)
            let logoW = img.width;
            let logoH = img.height;
            const maxW = imageCanvas.width * 0.2; 
            
            if (logoW > maxW) {
                const scale = maxW / logoW;
                logoW *= scale;
                logoH *= scale;
            }

            let x, y;
            const cw = imageCanvas.width;
            const ch = imageCanvas.height;

            switch(pos) {
                case 'tl': // Top Left
                    x = padding;
                    y = padding;
                    break;
                case 'tr': // Top Right
                    x = cw - logoW - padding;
                    y = padding;
                    break;
                case 'bl': // Bottom Left
                    x = padding;
                    y = ch - logoH - padding;
                    break;
                case 'br': // Bottom Right
                    x = cw - logoW - padding;
                    y = ch - logoH - padding;
                    break;
                default:
                    x = padding;
                    y = padding;
            }
            
            ctx.drawImage(img, x, y, logoW, logoH);
        }

        function finishProcessing(msg) {
            showToast(msg);
            downloadBtn.disabled = false;
            loadingOverlay.classList.add('hidden');
        }

        // --- Enhanced Algorithm: Texture-Aware Inpainting ---
        function performTextureAwareInpainting() {
            const width = imageCanvas.width;
            const height = imageCanvas.height;
            const imgData = ctx.getImageData(0, 0, width, height);
            const data = imgData.data;
            const maskData = maskCtx.getImageData(0, 0, width, height).data;

            const status = new Uint8Array(width * height);
            const maskIndices = [];
            const w = width;
            const h = height;

            // 1. Classification
            for (let i = 0; i < width * height; i++) {
                if (maskData[i * 4 + 3] > 0) {
                    status[i] = 1; // Masked
                    maskIndices.push(i);
                } else {
                    status[i] = 0; // Valid
                }
            }

            if (maskIndices.length === 0) return;

            // 2. Inward Fill with Wider Radius (Reduced blurriness)
            let filledCount = 0;
            let currentBoundary = [];
            
            // Initial boundary check
            for (let k = 0; k < maskIndices.length; k++) {
                const idx = maskIndices[k];
                if (hasValidNeighbor(idx, w, h, status)) {
                    currentBoundary.push(idx);
                }
            }

            let safetyLoop = 0;
            const totalMasked = maskIndices.length;

            while (filledCount < totalMasked && safetyLoop < w * 4) {
                const nextBoundary = [];
                
                for (const idx of currentBoundary) {
                    // Use a slightly larger radius (2) to grab more context
                    const color = getWeightedNeighborAverage(idx, w, h, data, status, 2);
                    if (color) {
                        const i = idx * 4;
                        data[i] = color.r;
                        data[i+1] = color.g;
                        data[i+2] = color.b;
                    }
                }

                // Commit changes
                for (const idx of currentBoundary) {
                    status[idx] = 2; // Filled
                    filledCount++;
                }
                
                // Find next layer
                for (const idx of currentBoundary) {
                    const neighbors = getMaskedNeighbors(idx, w, h, status);
                    for (const nIdx of neighbors) {
                        if (!nextBoundary.includes(nIdx)) {
                            nextBoundary.push(nIdx);
                        }
                    }
                }
                
                currentBoundary = nextBoundary;
                if (currentBoundary.length === 0 && filledCount < totalMasked) break; 
                safetyLoop++;
            }

            // 3. Texture Injection (The "Refinement" Step)
            // Instead of just smoothing, we calculate local noise and inject it back.
            // This prevents the "flat plastic" look.
            
            // Calculate global approximate noise level from unmasked sample
            // (Simplified: using a random variation based on valid neighbor variance)
            
            const iterations = 15; // Reduced from 40 to avoid over-smoothing
            const smoothRadius = 1; 

            for (let iter = 0; iter < iterations; iter++) {
                // Apply subtle smoothing
                if (iter % 2 === 0) {
                    for (let k = 0; k < maskIndices.length; k++) {
                        smartSmoothPixel(maskIndices[k], w, h, data, smoothRadius, iter === iterations - 1);
                    }
                } else {
                    for (let k = maskIndices.length - 1; k >= 0; k--) {
                        smartSmoothPixel(maskIndices[k], w, h, data, smoothRadius, iter === iterations - 1);
                    }
                }
            }

            ctx.putImageData(imgData, 0, 0);
            maskCtx.clearRect(0, 0, width, height);
            history = []; 
            saveHistory();
        }

        function hasValidNeighbor(idx, w, h, status) {
            const x = idx % w;
            const y = Math.floor(idx / w);
            const dirs = [[-1,0], [1,0], [0,-1], [0,1]];
            for (const d of dirs) {
                const nx = x + d[0];
                const ny = y + d[1];
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                    const nIdx = ny * w + nx;
                    if (status[nIdx] === 0 || status[nIdx] === 2) return true;
                }
            }
            return false;
        }

        function getMaskedNeighbors(idx, w, h, status) {
            const x = idx % w;
            const y = Math.floor(idx / w);
            const result = [];
            const dirs = [[-1,0], [1,0], [0,-1], [0,1]];
            for (const d of dirs) {
                const nx = x + d[0];
                const ny = y + d[1];
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                    const nIdx = ny * w + nx;
                    if (status[nIdx] === 1) result.push(nIdx);
                }
            }
            return result;
        }

        function getWeightedNeighborAverage(idx, w, h, data, status, radius) {
            const x = idx % w;
            const y = Math.floor(idx / w);
            let rSum = 0, gSum = 0, bSum = 0, weightSum = 0;
            
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    if (dx === 0 && dy === 0) continue;
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const nIdx = ny * w + nx;
                        const st = status[nIdx];
                        if (st === 0 || st === 2) {
                            const ni = nIdx * 4;
                            // Gaussian-like weight: closer pixels matter more
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            const weight = 1 / (dist + 0.1); 
                            
                            // Give original pixels slightly higher priority
                            const sourceWeight = (st === 0) ? 1.5 : 1.0;
                            
                            const finalWeight = weight * sourceWeight;

                            rSum += data[ni] * finalWeight;
                            gSum += data[ni+1] * finalWeight;
                            bSum += data[ni+2] * finalWeight;
                            weightSum += finalWeight;
                        }
                    }
                }
            }
            if (weightSum > 0) {
                return { r: rSum / weightSum, g: gSum / weightSum, b: bSum / weightSum };
            }
            return null;
        }

        function smartSmoothPixel(idx, w, h, data, radius, isLastPass) {
            const x = idx % w;
            const y = Math.floor(idx / w);
            const i = idx * 4;
            
            let rSum = 0, gSum = 0, bSum = 0, count = 0;
            
            // Simple box blur logic for smoothing
            for (let dy = -radius; dy <= radius; dy++) {
                for (let dx = -radius; dx <= radius; dx++) {
                    const nx = x + dx;
                    const ny = y + dy;
                    if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                        const ni = (ny * w + nx) * 4;
                        rSum += data[ni];
                        gSum += data[ni+1];
                        bSum += data[ni+2];
                        count++;
                    }
                }
            }
            
            if (count > 0) {
                const avgR = rSum / count;
                const avgG = gSum / count;
                const avgB = bSum / count;

                // Texture Injection (Noise) on the last pass
                if (isLastPass) {
                    // Generate subtle random noise (-10 to 10)
                    // In a real app we'd calculate local variance, here we approximate.
                    const noise = (Math.random() - 0.5) * 15; 
                    data[i] = Math.min(255, Math.max(0, avgR + noise));
                    data[i+1] = Math.min(255, Math.max(0, avgG + noise));
                    data[i+2] = Math.min(255, Math.max(0, avgB + noise));
                } else {
                    // Normal smooth
                    data[i] = avgR;
                    data[i+1] = avgG;
                    data[i+2] = avgB;
                }
            }
        }
